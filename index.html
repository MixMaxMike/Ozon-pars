    <script>
      // Suppress Vite client WebSocket disconnection noise in AI Studio preview iframe
      window.addEventListener('error', function (event) {
        if (event.filename && event.filename.indexOf('@vite/client') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event.reason && (event.reason.message || event.reason.stack || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
